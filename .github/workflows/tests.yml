name: Testes

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes da versao Android (sem aparelho)
        run: npm run test:android

      - name: Testes do userscript (TikTok simulado)
        run: npm run test:userscript

      - name: Testes da versao de navegador
        run: npm run test:web
